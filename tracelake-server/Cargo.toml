[package]
name = "tracelake-server"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
axum = "0.8"
serde = { version = "1.0.150", features = ["derive"] }
serde_json = "1.0.150"
slatedb = "0.13.1"
tokio = { version = "1.52.3", features = ["macros", "net", "rt-multi-thread"] }
tracelake-compact = { version = "0.1.0", path = "../tracelake-compact" }
tracelake-core = { version = "0.1.0", path = "../tracelake-core" }
tracelake-ingest = { version = "0.1.0", path = "../tracelake-ingest" }
tracelake-query = { version = "0.1.0", path = "../tracelake-query" }

[dev-dependencies]
chrono = "0.4.45"
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
