[workspace]
resolver = "3"
members = ["tracelake-core", "tracelake-ingest"]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
rust-version = "1.96"

[package]
name = "tracelake"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "tracelake"
path = "src/main.rs"
