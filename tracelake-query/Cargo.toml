[package]
name = "tracelake-query"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
chrono = "0.4.45"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
slatedb = "0.13.1"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread"] }
tracelake-compact = { version = "0.1.0", path = "../tracelake-compact" }
tracelake-core = { version = "0.1.0", path = "../tracelake-core" }
tracelake-ingest = { version = "0.1.0", path = "../tracelake-ingest" }

[dev-dependencies]
proptest = "1.11"
